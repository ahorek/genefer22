name: x64

on: [push, pull_request]

env:
  BOINC_DIR: ./boinc

jobs:
  build:
    runs-on: ubuntu-latest
    name: linux / ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Print GCC version
        run: |
          gcc -v

      - name: Install opencl
        run: |
          sudo apt-get install opencl-headers ocl-icd-opencl-dev

      - name: Build BOINC
        run: |
          cd ..
          git clone --depth 1 https://github.com/BOINC/boinc.git
          cd boinc
          ./_autosetup
          ./configure --disable-server --disable-manager --disable-client --enable-static CXXFLAGS="-O3"
          make -j

      - name: Build project
        working-directory: ./genefer
        run: |
          make -f Makefile_linux64 -j

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux64-latest
          retention-days: 1
          path: ./bin/*