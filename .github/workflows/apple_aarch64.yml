name: arm

on: [push, pull_request]

env:
  BOINC_DIR: ./boinc

jobs:
  build:
    runs-on: macos-15
    name: mac arm

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install libs
        run: |
          brew update
          brew install autoconf automake libtool libomp llvm texinfo

      - name: Print GCC version
        run: |
          /opt/homebrew/opt/llvm/bin/clang++ -v

      - name: Build BOINC
        run: |
          export PATH="/opt/homebrew/opt/libtool/libexec/gnubin:/usr/local/opt/libtool/libexec/gnubin:$PATH"
          export CC=/opt/homebrew/opt/llvm/bin/clang
          export CXX=/opt/homebrew/opt/llvm/bin/clang++
          export MACOSX_DEPLOYMENT_TARGET=11.0
          export CFLAGS="-mmacosx-version-min=11.0"
          export CXXFLAGS="-O3 -mmacosx-version-min=11.0"
          export LDFLAGS="-mmacosx-version-min=11.0"
          cd ..
          git clone --depth 1 https://github.com/BOINC/boinc.git
          cd boinc
          ./_autosetup
          ./configure --disable-server --disable-manager --disable-client --enable-static CXXFLAGS="-O3"
          make -j

      - name: Build GMP
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          export CFLAGS="-mmacosx-version-min=11.0"
          export CXXFLAGS="-O3 -mmacosx-version-min=11.0"
          export LDFLAGS="-mmacosx-version-min=11.0"
          export CC=/opt/homebrew/opt/llvm/bin/clang
          export CXX=/opt/homebrew/opt/llvm/bin/clang++
          cd ..
          git clone --depth 1 https://github.com/gmp-mirror/gmp-6.3.git
          cd gmp-6.3
          ./.bootstrap
          ./configure --disable-shared
          make -j
          ls

      - name: Build project
        working-directory: ./genefer
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          export CFLAGS="-mmacosx-version-min=11.0"
          export CXXFLAGS="-O3 -mmacosx-version-min=11.0"
          export LDFLAGS="-mmacosx-version-min=11.0"
          make -f makefile_mac_arm -j

      - name: Test
        working-directory: ./genefer
        run: |
          cd ../bin
          objdump -d --disassemble-symbols=__ZN4file8rc_crc32EjPKcm bin/genefer_mac_arm | grep -E 'z[0-9]+\.|ptrue|whilelo'
          ./genefer_mac_arm -h

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macarm-latest
          retention-days: 1
          path: ./bin/*
