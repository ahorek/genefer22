name: x64

on: [push, pull_request]

env:
  BOINC_DIR: ./boinc
  MACOSX_DEPLOYMENT_TARGET: "10.14"

jobs:
  build:
    runs-on: macos-13
    name: mac64

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install libs
        run: |
          brew update
          brew install autoconf automake libtool llvm texinfo

      - name: Print GCC version
        run: |
          /usr/local/opt/llvm/bin/clang++ -v

      - name: Build GMP
        run: |
          export PATH="/opt/homebrew/opt/libtool/libexec/gnubin:/usr/local/opt/libtool/libexec/gnubin:$PATH"
          export CC=/usr/local/opt/llvm/bin/clang
          export CXX=/usr/local/opt/llvm/bin/clang++
          git clone --depth 1 https://github.com/gmp-mirror/gmp-6.3.git
          cd gmp-6.3
          ./.bootstrap
          ./configure --prefix=${GITHUB_WORKSPACE}/../gmp CFLAGS="-mmacosx-version-min=10.14" CXXFLAGS="-mmacosx-version-min=10.14" LDFLAGS="-mmacosx-version-min=10.14"
          make -j
          make install

      - name: Build OMP
        run: |
          export PATH="/opt/homebrew/opt/libtool/libexec/gnubin:/usr/local/opt/libtool/libexec/gnubin:$PATH"
          export CC=/usr/local/opt/llvm/bin/clang
          export CXX=/usr/local/opt/llvm/bin/clang++
          git clone --depth 1 https://github.com/llvm/llvm-project.git
          cd llvm-project/openmp
          mkdir build
          cd build
          export CFLAGS="-mmacosx-version-min=10.14"
          export CXXFLAGS="-mmacosx-version-min=10.14"
          export LDFLAGS="-mmacosx-version-min=10.14"
          cmake ..
          make
          ls -l

      - name: Build BOINC
        run: |
          export PATH="/opt/homebrew/opt/libtool/libexec/gnubin:/usr/local/opt/libtool/libexec/gnubin:$PATH"
          export CC=/usr/local/opt/llvm/bin/clang
          export CXX=/usr/local/opt/llvm/bin/clang++
          cd ..
          git clone --depth 1 https://github.com/BOINC/boinc.git
          cd boinc
          ./_autosetup
          ./configure --disable-server --disable-manager --disable-client --enable-static CFLAGS="-O3 -mmacosx-version-min=10.14" CXXFLAGS="-O3 -mmacosx-version-min=10.14" LDFLAGS="-mmacosx-version-min=10.14"
          make -j

      - name: Build project
        working-directory: ./genefer
        run: |
          rm -f /usr/local/opt/libomp/lib/libomp.dylib
          rm -f /usr/local/opt/gmp/lib/libgmp.dylib
          make -f Makefile_macIntel -j
          cd ..
          cd bin
          otool -L genefer_macIntel
          ./genefer_macIntel -h

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac64-latest
          retention-days: 1
          path: ./bin/*