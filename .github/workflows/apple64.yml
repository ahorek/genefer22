name: x64

on: [push, pull_request]

env:
  BOINC_DIR: ./boinc
  MACOSX_DEPLOYMENT_TARGET: "10.14"

jobs:
  build:
    runs-on: macos-13
    name: mac64

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install libs
        run: |
          brew update
          brew install autoconf automake libtool libomp

      - name: Print GCC version
        run: |
          clang++ -v

      - name: Build GMP
        run: |
          git clone --depth 1 https://github.com/gmp-mirror/gmp-6.3.git
          cd gmp-6.3
          ./.bootstrap
          ./configure --host=x86_64-apple-darwin --prefix=${GITHUB_WORKSPACE}/../gmp
          make -j
          make install

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac64-latest
          retention-days: 1
          path: ./gmp