name: x64

on: [push, pull_request]

env:
  BOINC_DIR: ./boinc
  MACOSX_DEPLOYMENT_TARGET: "10.14"

jobs:
  build:
    runs-on: macos-15-intel
    name: mac64

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install libs
        run: |
          brew update

      - name: Print GCC version
        run: |
          clang++ -v
          cd aaa
          clang++ -std=c++11 -Wall -Wextra -pedantic -pthread test.cpp -o test_tls
          ./test_tls

      - name: Build BOINC
        run: |
          export PATH="/opt/homebrew/opt/libtool/libexec/gnubin:/usr/local/opt/libtool/libexec/gnubin:$PATH"
          export CC=/usr/local/opt/llvm/bin/clang
          export CXX=/usr/local/opt/llvm/bin/clang++
          cd ..
          git clone --depth 1 https://github.com/BOINC/boinc.git
          cd boinc
          ./_autosetup
          ./configure --disable-server --disable-manager --disable-client --enable-static CFLAGS="-O3 -mmacosx-version-min=10.14" CXXFLAGS="-O3 -mmacosx-version-min=10.14" LDFLAGS="-mmacosx-version-min=10.14"
          make -j

      - name: Build project
        working-directory: ./genefer
        run: |
          make -f Makefile_macIntel -j

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac64-latest
          retention-days: 1
          path: ./bin/*